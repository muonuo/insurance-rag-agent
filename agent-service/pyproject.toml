[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiostream>=0.7.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "dashscope>=1.26.4",
    "fastapi>=0.139.2",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-milvus>=0.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=5.2.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mineru-open-sdk>=0.2.5",
    "openai>=2.48.0",
    "psycopg[binary,pool]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymilvus>=3.0.0",
    "pypdf>=6.14.2",
    "ragas>=0.4.3,<0.5",
    "redis>=5",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# scikit-network 在 Windows + Python 3.14 下没有预编译wheel；ragas 只在生成
# 测试集时用到它，纯评测用不到，这里直接排除以免拖垮依赖安装
override-dependencies = ["scikit-network; sys_platform == 'never'"]

[tool.pytest.ini_options]
# 项目以python -m方式运行，app包未安装到环境，测试时将项目根目录加入sys.path
pythonpath = ["."]
testpaths = ["tests"]
